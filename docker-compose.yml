services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fandroid
      POSTGRES_USER: fandroid
      POSTGRES_PASSWORD: ${FANDROID_POSTGRES_PASSWORD:?set FANDROID_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fandroid -d fandroid"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      FANDROID_PORT: "8080"
      FANDROID_DATABASE_URL: jdbc:postgresql://postgres:5432/fandroid
      FANDROID_DATABASE_USER: fandroid
      FANDROID_DATABASE_PASSWORD: ${FANDROID_POSTGRES_PASSWORD:?set FANDROID_POSTGRES_PASSWORD}
      FANDROID_RETENTION_DAYS: "7"
      FANDROID_SESSION_DAYS: "30"
      FANDROID_RATE_LIMIT_PER_MINUTE: "120"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      FANDROID_DOMAIN: ${FANDROID_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [backend]

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
