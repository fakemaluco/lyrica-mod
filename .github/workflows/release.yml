name: Release

on:
  push:
    tags: ["v*"]

jobs:
  artifacts:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
      - run: cargo build --release --locked
        working-directory: media-bridge
      - name: Build standalone Lyrica jars
        id: build
        shell: pwsh
        run: |
          $releaseVersion = "${{ github.ref_name }}".TrimStart('v')
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT
          $notesPath = "docs/releases/$releaseVersion.md"
          if (Test-Path -LiteralPath $notesPath) {
            "notes=$notesPath" >> $env:GITHUB_OUTPUT
          }
          .\gradlew.bat :lyrics-popup:build :lyrics-popup-1.21.11:build :lyrics-popup-26.2:build :lyrics-popup-26.3:build "-Pversion=$releaseVersion" --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($game in @("1.21.1", "1.21.11", "26.2", "26.3")) {
            $module = if ($game -eq "1.21.1") { "lyrics-popup" } else { "lyrics-popup-$game" }
            $jar = Get-Item -LiteralPath "$module/build/libs/lyrica-$game-$releaseVersion.jar"
            $archive = [IO.Compression.ZipFile]::OpenRead($jar.FullName)
            try {
              if (!$archive.GetEntry("relaylyrics/native/windows-x86_64/relaylyrics-media-bridge.exe")) {
                throw "The Windows bridge is missing from $($jar.Name)"
              }
            } finally {
              $archive.Dispose()
            }
            Copy-Item -LiteralPath $jar.FullName -Destination release-assets
          }
          Copy-Item media-bridge/target/release/fandroid-media-bridge.exe release-assets/relaylyrics-media-bridge.exe
          $bridgeHash = (Get-FileHash release-assets/relaylyrics-media-bridge.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Encoding ascii release-assets/relaylyrics-media-bridge.exe.sha256 $bridgeHash
          Compress-Archive -Path integrations/youtube-music-extension/manifest.json,integrations/youtube-music-extension/content.js,integrations/youtube-music-extension/background.js,integrations/youtube-music-extension/README.md `
            -DestinationPath release-assets/lyrica-youtube-music-bridge-$releaseVersion.zip
      - name: Publish standalone jars
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.build.outputs.version }}
          body_path: ${{ steps.build.outputs.notes }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.jar
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.sha256
