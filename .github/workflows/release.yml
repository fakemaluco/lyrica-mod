name: Release

on:
  push:
    tags: ["v*"]

jobs:
  artifacts:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
      - run: cargo build --release --locked
        working-directory: media-bridge
      - name: Build standalone Lyrica jars
        shell: pwsh
        run: |
          $releaseVersion = "${{ github.ref_name }}".TrimStart('v')
          .\gradlew.bat :lyrics-popup:build :lyrics-popup-1.21.11:build :lyrics-popup-26.2:build "-Pversion=$releaseVersion" --no-daemon
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Get-ChildItem lyrics-popup/build/libs,lyrics-popup-1.21.11/build/libs,lyrics-popup-26.2/build/libs -Filter "lyrica-*.jar" |
            Where-Object { $_.Name -notmatch "sources|dev" } |
            Copy-Item -Destination release-assets
      - name: Publish standalone jars
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.jar
