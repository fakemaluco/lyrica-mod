name: CI

on:
  push:
  pull_request:

jobs:
  java:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: .\gradlew.bat build --no-daemon

  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: media-bridge
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spicetify-extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: spicetify-extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Test YouTube Music companion
        working-directory: youtube-music-extension
        run: node --test background.test.cjs content.test.cjs

