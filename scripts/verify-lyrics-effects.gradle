allprojects {
    tasks.withType(JavaExec).configureEach {
        if (name == 'runClient') {
            systemProperty 'lyrica.effectsSelfTest', 'true'
            systemProperty 'lyrica.lineAnimationSelfTest', providers.gradleProperty('lineAnimation').getOrElse('false')
            systemProperty 'lyrica.lineSmallSelfTest', providers.gradleProperty('lineSmall').getOrElse('false')
            systemProperty 'lyrica.effectsProbeOutput', rootProject.layout.buildDirectory.dir('lyrics-effects-qa').get().asFile.absolutePath
            args '--width', '854', '--height', '480'
        }
    }
}
